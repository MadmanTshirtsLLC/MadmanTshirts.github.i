plugins {
    id 'com.android.application'
}

android {
    namespace 'com.madmantshirts.r36bootconverter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.madmantshirts.r36bootconverter'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-min-gpl:6.0.3'
    implementation 'androidx.annotation:annotation:1.8.2'
}
