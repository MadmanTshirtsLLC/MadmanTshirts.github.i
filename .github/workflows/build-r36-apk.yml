name: Build R36 Boot Video Converter APK

on:
  push:
    branches: [r36tmax-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply compiler fix
        run: |
          sed -i 's/long timeMs = statistics.getTime();/double timeMs = statistics.getTime();/' app/src/main/java/com/madmantshirts/r36bootconverter/MainActivity.java

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk R36-Boot-Video-Converter-v1.0.1.apk
          sha256sum R36-Boot-Video-Converter-v1.0.1.apk > R36-Boot-Video-Converter-v1.0.1.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: R36-Boot-Video-Converter-v1.0.1
          path: |
            R36-Boot-Video-Converter-v1.0.1.apk
            R36-Boot-Video-Converter-v1.0.1.apk.sha256
          if-no-files-found: error
